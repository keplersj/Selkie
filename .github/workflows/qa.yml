name: qa

# Extra quality gates beside android.yml: PR title (Conventional Commits), workflow and script lint,
# Rust checks for the in-app compositor (rustfmt, clippy, cargo-deny, coverage against main), Kotlin checks for the app,
# the watch app and shared code (detekt against config/detekt/baseline.xml, Android lint, ktfmt
# formatting) and a review of the dependencies a PR adds or changes.
#
# Report-only for now: every check writes its findings to the job summary and as warnings, and the
# job stays green. Set ENFORCE to "true" to make a check fail its job once main is clean and the
# check is ready to become required (see the CI/CD plan).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ENFORCE: "false"

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit, and semantic-release reads those commits.
          # type(optional scope)!: description  -- https://www.conventionalcommits.org/en/v1.0.0/
          re='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "PR title is a Conventional Commit: $TITLE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          msg="PR title is not a Conventional Commit (e.g. 'feat(bridge): follow GNOME scale'): $TITLE"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENFORCE" = true ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg"

  workflows:
    name: Workflow and script lint (actionlint, zizmor, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: zizmor,shellcheck
      - name: actionlint
        run: |
          status=0
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::actionlint found problems (report-only)"
          fi
      - name: zizmor
        run: |
          status=0
          zizmor --offline --format=github .github/workflows || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::zizmor found problems (report-only)"
          fi

      - name: shellcheck
        run: |
          status=0
          shellcheck --format=gcc .github/scripts/*.sh || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::shellcheck found problems (report-only)"
          fi

  deny:
    name: Compositor dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/selkie-compositor
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny
      - name: cargo deny check ${{ matrix.check }}
        env:
          CHECKS: ${{ matrix.check }}
        run: |
          status=0
          # shellcheck disable=SC2086 # CHECKS is a word list on purpose
          cargo deny --color always check $CHECKS 2> deny.log || status=$?
          cat deny.log
          {
            echo "### cargo deny check $CHECKS"
            echo
            grep -E '^(error|warning)\[' deny.log | sort | uniq -c | sort -rn || echo "no findings"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::cargo deny check $CHECKS failed (report-only)"
          fi

  compositor-lint:
    name: Compositor lint (rustfmt, clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/selkie-compositor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: |
          status=0
          cargo fmt --check || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::rustfmt found unformatted code (report-only)"
          fi
      - name: clippy
        run: |
          status=0
          cargo clippy --all-targets --locked -- -D warnings || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::clippy found problems (report-only)"
          fi

  detekt:
    name: Kotlin static analysis (detekt, new findings only)
    runs-on: ubuntu-latest
    env:
      DETEKT_VERSION: 1.23.8
      DETEKT_SHA256: 3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download detekt-cli from Maven Central
        run: |
          curl -sSfLo detekt-cli.jar \
            "https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
          echo "$DETEKT_SHA256  detekt-cli.jar" | sha256sum -c -
      - name: detekt
        run: |
          status=0
          java -jar detekt-cli.jar --config config/detekt/detekt.yml --build-upon-default-config \
            --input app/src,wear/src,shared --baseline config/detekt/baseline.xml \
            --report txt:detekt.txt --report md:detekt.md || status=$?
          {
            echo "### detekt: findings not in the baseline"
            echo
            if [ -s detekt.txt ]; then echo '```'; head -100 detekt.txt; echo '```'; else echo "None."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::detekt found $(wc -l < detekt.txt) new findings (report-only)"
          fi

  android-lint:
    name: Android lint (app, watch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: lint
        run: |
          status=0
          ./gradlew --no-daemon --continue :app:lintDebug :wear:lintDebug || status=$?
          {
            echo "### Android lint"
            echo
            for f in app/build/reports/lint-results-debug.xml wear/build/reports/lint-results-debug.xml; do
              [ -f "$f" ] || { echo "- $f: no report"; continue; }
              printf -- '- %s: %s errors, %s warnings\n' "${f%%/*}" \
                "$(grep -c 'severity="Error"' "$f" || true)" "$(grep -c 'severity="Warning"' "$f" || true)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$ENFORCE" = true ]; then exit "$status"; fi
            echo "::warning::Android lint found errors (report-only)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint
          path: |
            app/build/reports/lint-results-debug.*
            wear/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  ktfmt:
    name: Kotlin formatting (ktfmt)
    runs-on: ubuntu-latest
    env:
      KTFMT_VERSION: "0.64"
      KTFMT_SHA256: 5b3d5286fd2defcc7dc8e28c21ddf156cc6b2d8682bdcd929ce4333e7a6201f2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download ktfmt from Maven Central
        run: |
          curl -sSfLo ktfmt.jar \
            "https://repo1.maven.org/maven2/com/facebook/ktfmt/$KTFMT_VERSION/ktfmt-$KTFMT_VERSION-with-dependencies.jar"
          echo "$KTFMT_SHA256  ktfmt.jar" | sha256sum -c -
      - name: ktfmt --kotlinlang-style --dry-run
        run: |
          # Lists the files that ktfmt would change. Kotlin's own style (4-space indents), the closest
          # to how the code is written now; once they're reformatted in one commit, ENFORCE keeps them so.
          find app/src wear/src shared -name '*.kt' -o -name '*.kts' | sort > files.txt
          java -jar ktfmt.jar --kotlinlang-style --dry-run $(cat files.txt) > unformatted.txt 2> ktfmt.log || true
          cat ktfmt.log
          n=$(grep -c . unformatted.txt || true)
          {
            echo "### ktfmt: $n of $(wc -l < files.txt) Kotlin files would change"
            echo
            if [ "$n" -gt 0 ]; then echo '```'; head -100 unformatted.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            if [ "$ENFORCE" = true ]; then echo "::error::ktfmt would reformat $n files"; exit 1; fi
            echo "::warning::ktfmt would reformat $n files (report-only)"
          fi

  dependency-review:
    name: Dependency review (new and changed dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the summary comment on the PR
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Flags known vulnerabilities and licenses in what the PR adds; warn-only until ENFORCE.
          fail-on-severity: moderate
          warn-only: ${{ env.ENFORCE != 'true' }}
          comment-summary-in-pr: on-failure

  compositor-coverage:
    name: Compositor coverage (cargo-llvm-cov, ratchet against main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download main's last coverage summary
    defaults:
      run:
        working-directory: native/selkie-compositor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/selkie-compositor
          key: compositor-coverage
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-llvm-cov
      - name: Run the tests under coverage
        run: |
          mkdir -p coverage
          # Failing tests are android.yml's to report; here they only make the numbers partial.
          status=0
          cargo llvm-cov --no-fail-fast --lcov --output-path coverage/lcov.info || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::some tests failed under coverage, so these numbers are partial (see android.yml)"
            echo "partial" > coverage/partial
          fi
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json
          jq '{lines: .data[0].totals.lines.percent, functions: .data[0].totals.functions.percent, regions: .data[0].totals.regions.percent}' \
            coverage/summary.json > coverage/totals.json
          cat coverage/totals.json
      - name: Compare with main
        env:
          GH_TOKEN: ${{ github.token }}
          # A PR may not lower line coverage by more than this many points (noise allowance).
          TOLERANCE: "0.5"
        run: |
          now=$(jq -r .lines coverage/totals.json)
          base=""
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow qa.yml --branch main --event push \
                    --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n compositor-coverage -D base 2>/dev/null; then
              base=$(jq -r .lines base/totals.json)
            fi
          fi
          {
            echo "### Compositor line coverage"
            echo
            printf '| | lines %% |\n| --- | --- |\n| this run | %.2f |\n' "$now"
            if [ -n "$base" ]; then printf '| main | %.2f |\n' "$base"; else echo "| main | no baseline yet |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$base" ] && awk -v n="$now" -v b="$base" -v t="$TOLERANCE" 'BEGIN{exit !(n < b - t)}'; then
            msg=$(printf 'Line coverage fell from %.2f%% on main to %.2f%%' "$base" "$now")
            if [ "$ENFORCE" = true ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg (report-only)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compositor-coverage
          path: native/selkie-compositor/coverage/
