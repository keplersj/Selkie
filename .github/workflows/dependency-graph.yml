name: dependency-graph

# Submits the resolved Gradle dependencies from main to GitHub's dependency graph, so Dependabot
# alerts and the dependency review in qa.yml can see the app's Maven dependencies (GitHub can't read
# them from the build files on its own). Cargo dependencies are read from Cargo.lock directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API needs it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
