name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  droidc:
    name: Build droidc (bionic + static musl) and the compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read droidc ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < droidc.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: keplersj/droidc
          ref: ${{ steps.ref.outputs.ref }}
          path: droidc-src
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            droidc-src/target
            native/selkie-compositor/target
          key: droidc-${{ runner.os }}-${{ hashFiles('droidc-src/Cargo.lock', 'native/selkie-compositor/Cargo.lock') }}-v3
          restore-keys: droidc-${{ runner.os }}-
      - name: Install NDK r27c
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Install zig, cargo-zigbuild, cargo-ndk
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo install cargo-ndk --locked
      - name: Build static musl (guest) binaries
        working-directory: droidc-src
        run: |
          # If droidc's README documents different commands, prefer those.
          cargo zigbuild --release --bin droidc --target aarch64-unknown-linux-musl
          cargo zigbuild --release --bin droidc --target x86_64-unknown-linux-musl
      - name: Build the guest shims (Rust, glibc: cgroup shim for systemd --user, network-interface shim)
        working-directory: droidc-src
        run: |
          # The guest is glibc, so this is not built against bionic or musl; glibc 2.28 is the floor.
          for arch in aarch64 x86_64; do
            for shim in cgshim ifshim; do
              cargo zigbuild --release --target $arch-unknown-linux-gnu.2.28 -p $shim
              ! objdump -T target/$arch-unknown-linux-gnu/release/lib$shim.so | grep -E 'GLIBC_2\.(29|[3-9][0-9])'
            done
          done
      - name: Build Android (bionic) binaries
        working-directory: droidc-src
        run: cargo ndk --platform 29 -t arm64-v8a -t x86_64 build --release --bin droidc
      - name: Test the compositor (Linux, real Wayland client)
        working-directory: native/selkie-compositor
        run: cargo test --release
      - name: Build the compositor (Android)
        working-directory: native/selkie-compositor
        run: cargo ndk --platform 29 -t arm64-v8a -t x86_64 build --release --lib
      - name: Stage
        run: |
          mkdir -p out/arm64-v8a out/x86_64
          cp native/selkie-compositor/target/aarch64-linux-android/release/libselkie_compositor.so out/arm64-v8a/
          cp native/selkie-compositor/target/x86_64-linux-android/release/libselkie_compositor.so out/x86_64/
          cp droidc-src/target/aarch64-linux-android/release/droidc out/arm64-v8a/libdroidc.so
          cp droidc-src/target/x86_64-linux-android/release/droidc out/x86_64/libdroidc.so
          cp droidc-src/target/aarch64-unknown-linux-musl/release/droidc out/arm64-v8a/libdroidc-guest.so
          cp droidc-src/target/x86_64-unknown-linux-musl/release/droidc out/x86_64/libdroidc-guest.so
          file out/*/*.so
          cp droidc-src/target/aarch64-unknown-linux-gnu/release/libcgshim.so out/arm64-v8a/libcgshim.so
          cp droidc-src/target/x86_64-unknown-linux-gnu/release/libcgshim.so out/x86_64/libcgshim.so
          cp droidc-src/target/aarch64-unknown-linux-gnu/release/libifshim.so out/arm64-v8a/libifshim.so
          cp droidc-src/target/x86_64-unknown-linux-gnu/release/libifshim.so out/x86_64/libifshim.so
          echo "$(git -C droidc-src rev-parse HEAD)" > out/DROIDC_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidc-android
          path: out

  proot:
    uses: ./.github/workflows/proot.yml

  apk:
    name: Build APK and unit tests
    needs: [droidc, proot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidc-android
          path: third_party/bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proot-android
          path: third_party/bin
      - name: Show native binaries
        run: find third_party/bin -type f | sort
      - name: Build release APK + unit tests, debug + androidTest APKs
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify UI screenshots
        # Renders every @Preview with Robolectric and compares it to app/screenshots/ (docs/ui-previews.md).
        # If a change is intended, re-record with recordRoborazziDebug and commit the new PNGs.
        run: ./gradlew --no-daemon verifyRoborazziDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi
      - name: Name the APK
        run: |
          VERSION=$(sed -n 's/^val selkieVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/selkie-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selkie-apk
          path: dist/selkie-*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-apks
          path: |
            dist/app-debug.apk
            dist/app-debug-androidTest.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests

  emulator-e2e:
    name: Emulator E2E (x86_64, API 34)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 12G
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -qemu -cpu host
          disable-animations: true
          # CentOS Stream 10 glibc requires x86-64-v3; the default emulator CPU model lacks it.
          script: bash .github/scripts/e2e.sh apks out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-results
          path: out

  emulator-gui:
    name: Emulator GUI (Bluefin LTS GNOME, x86_64, API 34)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-apks
          path: apks
      - name: Free runner disk (Bluefin needs ~13 GB inside a 32 GB AVD)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY" /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the desktop test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 32G
          ram-size: 6144M
          heap-size: 512M
          cores: 4
          force-avd-creation: false
          # Bluefin LTS (CentOS 10) glibc requires x86-64-v3; the default emulator CPU model lacks it.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -qemu -cpu host
          disable-animations: true
          script: bash .github/scripts/e2e-gui.sh apks out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gui-results
          path: out

  # Publishes a GitHub *pre*release when a tag like v0.1.0-mvp.1 is pushed, only after the
  # emulator e2e passed. Attaches the signed APK and the proot GPL-2 corresponding source.
  prerelease:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    needs: [apk, proot, droidc, emulator-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selkie-apk
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proot-android
          path: proot
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidc-android
          path: droidc
      - name: Collect assets
        run: |
          cp proot/proot-src-*.tar.gz dist/
          cp droidc/DROIDC_COMMIT dist/DROIDC_COMMIT.txt
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          make_latest: false
          body_path: docs/release-notes.md
          files: dist/*

  # Keeps a rolling *pre*release tagged `latest` pointing at the newest main that passed CI, so there
  # is always a public APK (artifacts need a GitHub login and expire). The release is replaced on each
  # push to main; creating it with GITHUB_TOKEN does not start another workflow run.
  rolling-prerelease:
    name: Publish rolling prerelease (latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apk, proot, droidc, emulator-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selkie-apk
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proot-android
          path: proot
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidc-android
          path: droidc
      - name: Collect assets
        run: |
          cp dist/selkie-*.apk dist/selkie-latest.apk
          rm dist/selkie-[0-9]*.apk
          cp proot/proot-src-*.tar.gz dist/
          cp droidc/DROIDC_COMMIT dist/DROIDC_COMMIT.txt
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: Write release notes
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "Rolling build of \`main\`, replaced on every push that passes CI (unit tests and emulator E2E)."
            echo
            echo "- Commit: [\`${SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}): $(git log -1 --format=%s)"
            echo "- droidc: \`$(tr -d '[:space:]' < droidc.ref | cut -c1-7)\` (see \`DROIDC_COMMIT.txt\`)"
            echo
            echo "Not a versioned release. Install \`selkie-latest.apk\` (arm64-v8a + x86_64), signed with the public MVP test key (\`keystore/selkie-mvp.jks\`; for testing only)."
            echo "\`proot-src-*.tar.gz\` is the corresponding source for the bundled proot (GPL-2). \`SHA256SUMS\` covers every asset."
            echo
            echo "Versioned prereleases are tagged \`v*\`."
          } > notes.md
          cat notes.md
      - name: Replace the rolling release
        env:
          SHA: ${{ github.sha }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "$SHA" \
            --prerelease \
            --latest=false \
            --title "Latest main (${SHA::7})" \
            --notes-file notes.md
